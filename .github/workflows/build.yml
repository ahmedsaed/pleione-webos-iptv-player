name: Build IPK

on:
  push:
    branches: [main, pleione]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The E2E suite is split across runners so a full run takes minutes.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/6

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: test-output/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.5

      - name: Cache service runtimes
        uses: actions/cache@v6
        with:
          path: ~/.cache/webos-iptv-player/node-runtimes
          key: service-node-runtimes-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Type check
        run: npx tsc --noEmit && npx tsc -p bundled-service/tsconfig.json && npm run benchmark:typecheck

      - name: Lint and compatibility gate
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Bundle
        run: node esbuild.config.mjs

      - name: Build service
        run: |
          rm -rf build/bundled-service
          npx tsc -p bundled-service/tsconfig.json
          node scripts/service-compat-gate.mjs build/bundled-service
          node scripts/run-service-smoke.mjs --matrix
          cp bundled-service/package.json build/bundled-service/
          cp bundled-service/src/services.json build/bundled-service/
          cp bundled-service/src/setup/setup-page.html build/bundled-service/setup/

      - name: Package IPK
        run: ares-package --no-minify -e "*preview-libs.js" dist build/bundled-service -o .

      - name: Generate Homebrew Channel manifest
        run: npm run manifest

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webos-iptv-player
          path: |
            *.ipk
            *.manifest.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: webos-iptv-player

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.ipk
            *.manifest.json
