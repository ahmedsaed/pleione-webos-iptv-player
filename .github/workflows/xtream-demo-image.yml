name: Demo Xtream image

# Builds the demo Xtream server image, checks that it signs in, lists
# channels and serves a stream, and publishes it to GHCR from pleione.
on:
  pull_request:
    paths: ['scripts/xtream-demo/**', 'scripts/xtream-demo-server.mjs', 'scripts/cli-args.mjs', '.dockerignore', '.github/workflows/xtream-demo-image.yml']
  push:
    branches: [pleione]
    paths: ['scripts/xtream-demo/**', 'scripts/xtream-demo-server.mjs', 'scripts/cli-args.mjs', '.dockerignore', '.github/workflows/xtream-demo-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: xtream-demo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pleione-xtream-demo
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          docker build -f scripts/xtream-demo/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .

      - name: Smoke test
        run: |
          docker run -d --name demo -p 8090:8090 \
            -e XTREAM_DEMO_USERNAME=ci -e XTREAM_DEMO_PASSWORD=ci "$IMAGE:latest"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' demo)" = healthy ] && break
            sleep 2
          done
          base=http://localhost:8090
          curl -fsS "$base/player_api.php?username=ci&password=ci" | grep -q '"auth":1'
          curl -fsS "$base/player_api.php?username=x&password=x" | grep -q '"auth":0'
          curl -fsS "$base/player_api.php?username=ci&password=ci&action=get_live_streams" | grep -q stream_id
          curl -fsS "$base/live/ci/ci/1.m3u8" | grep -q EXT-X-STREAM-INF
          curl -fsS -o /dev/null "$base/xmltv.php?username=ci&password=ci"

      - name: Show logs
        if: failure()
        run: docker logs demo

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGE"
